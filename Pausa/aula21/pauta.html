<!DOCTYPE html>
<html lang="PT.BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAUTA ESCOLAR</title>
</head>
<body>
    <h1>Pauta da 12ªclasse</h1>

    <input type="text" name="nome" id="nome">
    <input type="number" name="1 trimestre" id="t1">
     <input type="number" name="2 trimestre" id="t2">
      <input type="number" name="3 trimestre" id="t3">
    <input type="button" value="salvar" onclick="salvar()" id="bt">

    <div id="mf" >Média Final</div>
    <div id="cf" >Estado</div>
    <script>
        function salvar(){
        var nome=window.document.getElementById('nome')
        var t1=window.document.getElementById('t1')
        var t2=window.document.getElementById('t2')
        var t3=window.document.getElementById('t3')
        var mf=window.document.getElementById('mf')
        var cf=window.document.getElementById('cf')

        t1=Number(t1.value)
        t2=Number(t2.value)
        t3=Number(t3.value)

        var s=(t1+t2+t3)/3
        mf.innerHTML=`${s}`
        if(s>=9.5){
            cf.innerHTML=`APROVADO`
        }
        else{
            cf.innerHTML=`REPROVADO`
        }
        }
        
      

    </script>
    
</body>
</html>
