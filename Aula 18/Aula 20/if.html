<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=h, initial-scale=1.0">
    <title>Usando if</title>
</head>
<body>
    <h1>Usando If</h1>
    <p>Quantos dolares tem o Joaquim</p>

    $ <input type="number" name="ef" id="ef">
        <input type="button" value="verificar" onclick="verificar()">
        <div id="d1"> É RICO ou POBRE</div>
     
    
    <script>
    
        function verificar(){
        var n1=window.document.getElementById('ef') 
        var n=Number(n1.value)
        var d1=window.document.getElementById('d1')
        
        if(n>1000){
            d1.innerHTML=`O seu capital é de ${n>=1000} dolares, você é rico.`
        }else if(n>=1000){  
            d1.innerHTML=`O seu capital é de ${n>=500} dolares, você é pobre.` 
        }else{
              d1.innerHTML=`O seu capital é de ${n>=100} dolares, você é muito pobre.`
         }

        }
        
         </script>
</body>
